name: Deploy MERN Stack to ECS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build and push backend Docker image
        run: |
          docker build -t ${{ secrets.ECR_BACKEND_REPO }}:latest ./backend
          docker tag ${{ secrets.ECR_BACKEND_REPO }}:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/${{ secrets.ECR_BACKEND_REPO }}:latest
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/${{ secrets.ECR_BACKEND_REPO }}:latest

      - name: Build and push frontend Docker image
        env:
          REACT_APP_BACKEND_URL: 'http://MERN-backend-avib10-1234596112.ap-south-1.elb.amazonaws.com:3001'
        run: |
          echo "REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL}" > ./frontend/.env
          docker build -t ${{ secrets.ECR_FRONTEND_REPO }}:latest ./frontend
          docker tag ${{ secrets.ECR_FRONTEND_REPO }}:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/${{ secrets.ECR_FRONTEND_REPO }}:latest
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/${{ secrets.ECR_FRONTEND_REPO }}:latest

      - name: Update ECS Backend Service
        uses: aws-actions/amazon-ecs-update-service@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ secrets.AWS_REGION }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          service: backend-mongo-avib10-service-x16djjrd
          task-definition: ${{ secrets.AWS_BACKEND_TASK }}
          image: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/${{ secrets.ECR_BACKEND_REPO }}:latest

      - name: Update ECS Frontend Service
        uses: aws-actions/amazon-ecs-update-service@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ secrets.AWS_REGION }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          service: Frontend-avib10-service-23vd0ju8
          task-definition: ${{ secrets.AWS_FRONTEND_TASK }}
          image: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/${{ secrets.ECR_FRONTEND_REPO }}:latest
